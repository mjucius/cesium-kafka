org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Dev/source-build version on the 2.0.0 track. A release build derives the real version from the
# git tag (release.yml passes -PcesiumVersion=<tag without 'v'>), so tagging v2.0.0 stamps 2.0.0.
cesiumVersion=2.0.0-SNAPSHOT
