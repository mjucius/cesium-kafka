org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Dev/source-build version on the 2.1.3 track. A release build derives the real version from the
# git tag (release.yml passes -PcesiumVersion=<tag without 'v'>), so tagging v2.1.3 stamps 2.1.3.
cesiumVersion=2.1.3-SNAPSHOT
