[versions]
kafka = "4.4.0"
fastutil = "8.5.19"
micrometer = "1.17.1"
# jackson/logback bumped for SCA hygiene (audit L8): jackson >= 2.21.1 (latest stable 2.2x) clears
# GHSA-72hv-8253-57qq, logback >= 1.5.19 clears CVE-2025-11226 — both unreachable here but flagged
# by scanners. Kept current via Dependabot's gradle ecosystem (.github/dependabot.yml).
jackson = "2.22.3"
slf4j = "2.0.20"
logback = "1.6.5"
# kafka-clients' lz4/snappy codecs, required above the 1.11.2/1.1.10.7 that kafka-clients 4.4.0
# declares (SCA hygiene, constraints in cesium-kafka-core): lz4-java 1.11.4 clears CVE-2026-106451
# (JNI library extracted to a predictable temp path; producers here compress with lz4), and
# snappy-java >= 1.1.10.9 clears CVE-2026-108106 (unbounded allocation in SnappyInputStream when
# decompressing third-party snappy batches). Kafka chose the same versions on its own branches
# (KAFKA-21174; snappy 1.1.10.12 on 4.4). Stay on lz4-java 1.11.x until kafka-clients moves:
# 1.12.0 tightens input validation and Kafka has not adopted it. Drop both once kafka-clients
# declares these versions or newer.
lz4-java = "1.11.4"
snappy-java = "1.1.10.12"
jspecify = "1.0.1"
junit = "6.1.3"
junit-platform = "6.1.3"
testcontainers = "1.21.4"
jqwik = "1.10.2"
awaitility = "4.3.0"
jol = "0.17"
errorprone = "2.50.0"
nullaway = "0.14.2"
palantir-java-format = "2.68.0"
spotless-plugin = "8.10.4"
errorprone-plugin = "5.1.0"
jmh-plugin = "0.7.3"

[libraries]
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
fastutil-core = { module = "it.unimi.dsi:fastutil-core", version.ref = "fastutil" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4-java" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version.ref = "snappy-java" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:toxiproxy", version.ref = "testcontainers" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
jol-core = { module = "org.openjdk.jol:jol-core", version.ref = "jol" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# Plugin jars consumed by build-logic as implementation dependencies. ALL of them belong here, not in
# a [plugins] block applied per-module: Gradle caches one plugin classloader per distinct classpath,
# so a module that adds a plugin its siblings lack gets its OWN classloader — and a plugin holding a
# shared BuildService (Spotless's SpotlessTaskService) then sees two distinct Class objects for it and
# fails the build. Routing every plugin through build-logic keeps one classpath for every subproject.
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }
errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
# Resolves from gradlePluginPortal (not Central); build-logic/settings.gradle.kts declares both.
jmh-plugin = { module = "me.champeau.jmh:jmh-gradle-plugin", version.ref = "jmh-plugin" }
