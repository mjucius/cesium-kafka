# Content-pin the Gradle distribution (audit L9): the wrapper aborts unless the downloaded
# gradle-9.8.1-bin.zip hashes to this SHA-256 (the official checksum published at
# https://services.gradle.org/distributions/gradle-9.8.1-bin.zip.sha256). Update this sum together
# with distributionUrl on every Gradle bump. NOTE: full Maven-dependency verification
# (gradle/verification-metadata.xml via `./gradlew --write-verification-metadata sha256`) is a
# recommended follow-up — deliberately omitted pre-1.0 as too brittle to maintain by hand.
distributionSha256Sum=21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
