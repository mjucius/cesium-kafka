# Dependabot keeps the supply-chain pins current (audit M4).
#
#   * github-actions — the third-party actions in .github/workflows/{ci,nightly,release}.yml are
#     SHA-pinned to immutable commits (audit M4). Pinning trades freshness for integrity, so
#     Dependabot is REQUIRED to bump those SHAs (and their trailing "# vX.Y.Z" comments) as new
#     releases land — otherwise the pins silently rot and miss upstream security fixes.
#   * gradle — surfaces dependency updates for the version catalog (gradle/libs.versions.toml),
#     gradle.properties, and the build scripts, so the jackson/logback (audit L8) and other library
#     pins keep pace with upstream patch releases and SCA advisories.
#
# Weekly cadence keeps PR churn low; grouped minor/patch PRs reduce noise.
#
# Cooldown: a release must have aged before Dependabot proposes it, so upstream regressions and
# pulled releases surface first. For Maven artifacts Dependabot dates a release by its Maven
# Central directory listing, and for Apache projects that is the day the release candidate was
# staged, not the day the vote passed: kafka-clients 4.4.0 is listed 2026-10-06, was promoted to
# Central 2026-10-13, and was still unannounced on 2026-10-18 when PR #34 opened. Minor and major
# bumps therefore wait 21 days from that date (for 4.4.0, two weeks after the vote passed);
# patches and GitHub Actions (dated by their release) wait 7. Cooldown never delays Dependabot
# security updates, but those are disabled on this repository, so a security fix waits too:
# bump it by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    cooldown:
      default-days: 7
      semver-minor-days: 21
      semver-major-days: 21
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # JUnit's jupiter artifact and the platform launcher are version-locked and MUST move together
      # (jupiter 6.x requires platform 6.x). Group all their update-types into a single PR so a major
      # bump never arrives as two separate, individually-unbuildable mismatched PRs (as 5→6 did).
      junit:
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
