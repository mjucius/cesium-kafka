# Dependabot keeps the supply-chain pins current (audit M4).
#
#   * github-actions — the third-party actions in .github/workflows/{ci,nightly,release}.yml are
#     SHA-pinned to immutable commits (audit M4). Pinning trades freshness for integrity, so
#     Dependabot is REQUIRED to bump those SHAs (and their trailing "# vX.Y.Z" comments) as new
#     releases land — otherwise the pins silently rot and miss upstream security fixes.
#   * gradle — surfaces dependency updates for the version catalog (gradle/libs.versions.toml),
#     gradle.properties, and the build scripts, so the jackson/logback (audit L8) and other library
#     pins keep pace with upstream patch releases and SCA advisories.
#
# Weekly cadence keeps PR churn low for a pre-1.0 project; grouped minor/patch PRs reduce noise.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # JUnit's jupiter artifact and the platform launcher are version-locked and MUST move together
      # (jupiter 6.x requires platform 6.x). Group all their update-types into a single PR so a major
      # bump never arrives as two separate, individually-unbuildable mismatched PRs (as 5→6 did).
      junit:
        patterns:
          - "org.junit.jupiter:*"
          - "org.junit.platform:*"
    ignore:
      # Hold spotless at 7.x: 8.x has a shared-BuildService classloader conflict
      # (SpotlessTaskService loaded by two project scopes) with this build's jmh-plugin +
      # convention-plugin + included-build (build-logic) layout — it fails :cesium-kafka-benchmarks
      # at configuration time. Spotless is a build-only formatter with no security/correctness
      # surface, so we pin the working major until the upstream interaction is resolved.
      - dependency-name: "com.diffplug.spotless:spotless-plugin-gradle"
        update-types: ["version-update:semver-major"]
