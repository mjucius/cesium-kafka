name: Release

# Tag-driven release (design §13, as superseded by ADR-0017 / the repo-only publishing decision).
#
# REPO-ONLY PUBLISHING. This workflow builds, verifies, and publishes a GitHub Release with
# the application distribution archives (distTar/distZip) ONLY. There is deliberately:
#   * NO Maven Central / Sonatype publish of cesium-kafka-core, and
#   * NO container image push to GHCR or any other registry.
# Both are OUT OF SCOPE by owner decision (the runnable APP is the supported product; the
# engine programmatic API stays internal; ADR-0019). See docs/adr/0017-kafka-4-floor-and-repo-only-publishing.md.
# How they WOULD be added later, if/when the decision is revisited:
#   * Maven Central: add the `maven-publish` + `signing` plugins to cesium-kafka-core,
#     a `publishToSonatype` step here gated on OIDC/Sonatype credentials (secrets), and POM metadata.
#   * GHCR image: a `docker/build-push-action` step using the existing multi-stage Dockerfile, with
#     `packages: write` added to the permissions block below and a `ghcr.io/<owner>/cesium-kafka` tag.
# Neither requires changes to the build's correctness posture; they are purely additive jobs/steps.
#
# THREE WAYS TO START A RELEASE (the `detect` job works out which one, and whether to release):
#   * AUTOMATIC, on a push to `main` that changes CHANGELOG.md: if the top dated section,
#     `## [X.Y.Z] - <date>`, names a version newer than every existing `v*` tag, the run builds that
#     `main` commit and releases X.Y.Z. Any other push to main (no new section, or a version that is
#     not newer than the latest tag) is a no-op: `detect` passes and `release` is skipped. So cutting
#     the changelog section on main IS the release step; the section is also the Release body.
#   * Run this workflow manually (Actions tab, or the API's workflow_dispatch) on `main` with a
#     `version` input such as `2.1.6`; CHANGELOG.md must have a section for it.
#   * Push a `v<version>` tag (e.g. a signed tag from a maintainer's machine). The run builds that tag.
# In the first two cases the run creates the annotated tag `v<version>` on the built commit only
# after the build, both test lanes and the archives succeed, so a failed run leaves no tag behind.
# Those tags are created by github-actions[bot] and are not signed. A tag pushed with the workflow's
# GITHUB_TOKEN does not trigger other workflows, so it does not start a second, tag-triggered run.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Branch pushes only start a run when the changelog changed. GitHub doesn't apply path filters
    # to tag pushes, so a pushed v* tag always starts one.
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 2.1.6). CHANGELOG.md must have a section for it."
        required: true
        type: string

# contents: write is required to create the GitHub Release, upload the archive assets, and push the
# release tag. No `packages: write` — there is no image push (see the header note).
permissions:
  contents: write

jobs:
  detect:
    name: Decide whether this run releases, and which version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      create_tag: ${{ steps.decide.outputs.create_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, to compare the changelog version against every existing tag.
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          # Read the ref/input from the environment (never interpolated as a ${{ }} expression into
          # the shell body) so a hostile tag or input string cannot break out of the quoting.
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          skip() { echo "No release: $1"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::A manual release must run on main, not $GITHUB_REF"
              exit 1
            fi
            tag="v${INPUT_VERSION}"
            create_tag=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # The top dated section; `## [Unreleased]` doesn't match the numeric pattern.
            version=$(grep -m1 -oE '^## \[[0-9][0-9.]*\]' CHANGELOG.md | sed -E 's/^## \[(.*)\]$/\1/' || true)
            [ -n "$version" ] || skip "CHANGELOG.md has no dated version section"
            latest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
            if [ -n "$latest" ]; then
              newest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)
              if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
                skip "top CHANGELOG.md version $version is not newer than the latest tag v$latest"
              fi
            fi
            tag="v${version}"
            create_tag=true
          else
            tag="${GITHUB_REF_NAME}"
            create_tag=false
          fi
          # A git tag may legally contain shell metacharacters ($ ( ) ` ; & | { }). Reject any tag
          # that is not a clean `v<NUMBER[.NUMBER...]>` string BEFORE the derived version is ever
          # interpolated into a -PcesiumVersion shell argument downstream (defence against tag-driven
          # template/command injection — audit L10). Fail the job loudly otherwise.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9.]*$'; then
            echo "::error::Refusing to release: tag '$tag' is not of the form v<NUMBER[.NUMBER...]>"
            exit 1
          fi
          version="${tag#v}"
          if [ "$create_tag" = true ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::Tag $tag already exists; pick a new version"
              exit 1
            fi
            if ! grep -Fq "## [$version]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$version]' section; cut it on main first"
              exit 1
            fi
          fi
          {
            echo "release=true"
            echo "version=$version"
            echo "tag=$tag"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing cesium-kafka $version (tag $tag) from $(git rev-parse HEAD)"

  release:
    name: Build, verify, and publish GitHub Release (repo-only)
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Never cancel an in-flight release: a release build is a one-shot artifact we want to complete.
      # Keyed on the version so runs releasing the same version cannot overlap.
      group: release-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    env:
      # detect validated these against ^v[0-9][0-9.]*$, so they are safe to use in the steps below.
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the changelog/release-notes generation has the prior tags.
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          # Since v6.0.1, setup-java only warns on a failed JDK signature check unless this is set; the
          # release lane builds shipped artifacts, so keep verification fatal as it was in v6.0.0.
          verify-signature: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Re-check the tag is still free
        # Two pushes close together can both pass detect before either run creates the tag; the
        # concurrency group serialises them, and this stops the later one before a wasted build.
        if: needs.detect.outputs.create_tag == 'true'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG was created by an earlier run while this one waited"
            exit 1
          fi

      # The version is threaded into every Gradle invocation via -PcesiumVersion (the property the
      # java-conventions plugin reads; gradle.properties default is the -SNAPSHOT dev version). This
      # stamps the dist archive names and the /info build-info. VERSION comes from the job env.

      # Full build + unit tests on the release version across the whole repo.
      - name: Build + unit tests
        run: ./gradlew build -PcesiumVersion="$VERSION"

      # The representative integration lane. Per ci.yml / design §13 this single lane already runs the
      # M0–M5 EOS suite PLUS the two NON-NEGOTIABLE hazard tests — the LSO replay barrier (§11.3-4) and
      # the I8 barrier-ordering test (§11.3-5), both single-broker, deterministic, and fast. The heavy
      # @Tag("nightly")/@Tag("soak")/@Tag("kip848") lanes are nightly signal, not a release gate.
      - name: Integration tests (representative lane, incl. the two hazard tests)
        run: ./gradlew :cesium-kafka-it:integrationTest -PcesiumVersion="$VERSION"
      - name: Upload integration reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-integration-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Build distribution archives (distTar + distZip)
        run: >-
          ./gradlew :cesium-kafka-app:distTar :cesium-kafka-app:distZip
          -PcesiumVersion="$VERSION"

      - name: Extract the CHANGELOG section for this version
        id: changelog
        # Pull the body under `## [<version>]` up to (but not including) the next `## [` header, so the
        # Release body is the curated Keep-a-Changelog entry. Fall back to a pointer if the tag has no
        # matching section yet (e.g. a pre-release cut before CHANGELOG.md is updated).
        run: |
          version="$VERSION"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; falling back to a pointer."
            printf 'See the [CHANGELOG](CHANGELOG.md) for the full notes.\n' > release-notes.md
          fi
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create and push the release tag (automatic and manual runs)
        # Runs only after the build, both test lanes and the archives have succeeded, so a failed
        # run never leaves a tag behind. The tag points at the exact commit that was built.
        if: needs.detect.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "cesium-kafka $VERSION" HEAD
          git push origin "refs/tags/$TAG"

      - name: Create the GitHub Release with the distribution archives
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Needed when github.ref is a branch (automatic/manual runs); equals the pushed tag otherwise.
          tag_name: ${{ needs.detect.outputs.tag }}
          # An action `with:` input is passed as an argument (never shell-evaluated), and the version
          # was already validated against ^v[0-9][0-9.]*$ in the detect job, so the expression is safe here.
          name: cesium-kafka ${{ needs.detect.outputs.version }}
          # Curated CHANGELOG section first; GitHub appends the auto-generated commit/PR list below it.
          body_path: release-notes.md
          generate_release_notes: true
          # A missing archive must fail the release loudly rather than ship an empty Release.
          fail_on_unmatched_files: true
          files: |
            cesium-kafka-app/build/distributions/*.tar
            cesium-kafka-app/build/distributions/*.zip
