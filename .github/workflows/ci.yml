name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build + unit (JDK ${{ matrix.test-jvm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compile toolchain is pinned to 21; the matrix runs the test suites on each LTS JVM.
        test-jvm: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # Install the test JVM AND 21, with 21 LAST so it becomes JAVA_HOME — i.e. Gradle (and
          # therefore Spotless/palantir-java-format, which runs in the Gradle JVM and hooks javac
          # internals that newer JDKs change) always runs on 21. The matrix test JVM is still
          # installed, so the Gradle toolchain runs the test suites on it via -PtestToolchain.
          java-version: |
            ${{ matrix.test-jvm }}
            21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build and test
        run: ./gradlew build -PtestToolchain=${{ matrix.test-jvm }}

  integration:
    name: Integration (Testcontainers, Kafka 4.x KRaft) — representative lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Integration tests (representative lane)
        # Design §13: the PR lane runs the representative classic-protocol suite. The java-conventions
        # plugin excludes three tag families from every default lane:
        #   @Tag("soak")    — nightly memory-ceiling / JOL lane (dedicated soakTest task)
        #   @Tag("nightly") — heavy Toxiproxy / compaction / multi-instance fault-injection scenarios
        #   @Tag("kip848")  — the non-blocking KIP-848 consumer-protocol variants (D12)
        # so this lane keeps the M0–M5 EOS suite PLUS the two NON-NEGOTIABLE hazard tests — the LSO
        # barrier (§11.3-4) and the I8 barrier-ordering (§11.3-5) — both of which are single-broker,
        # deterministic, and fast enough for PR. The heavy lanes run nightly (nightly.yml); opt them
        # back in locally with -PincludeNightly / -PincludeKip848 / -Pkip848Only.
        run: ./gradlew :cesium-kafka-it:integrationTest
