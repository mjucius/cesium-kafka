name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build + unit (JDK ${{ matrix.test-jvm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Compile toolchain is pinned to 21; the matrix runs the test suites on each LTS JVM.
        test-jvm: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            ${{ matrix.test-jvm }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build -PtestToolchain=${{ matrix.test-jvm }}

  integration:
    name: Integration (Testcontainers, Kafka 4.x KRaft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Integration tests (representative lane)
        run: ./gradlew :cesium-kafka-it:integrationTest
